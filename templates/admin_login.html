<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – HealthBridge NGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"/>
</head>
<body class="admin-body">
<div class="admin-login-wrapper">
  <div class="login-card">
    <div class="login-logo"><i class="bi bi-heart-pulse-fill"></i></div>
    <h2>Admin Portal</h2>
    <p class="login-subtitle">HealthBridge NGO · Secure Access</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} mb-3" style="border-radius:8px;font-size:.88rem;">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}" class="admin-form-section">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus/>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <div class="input-group">
          <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Enter password" required/>
          <button class="btn" type="button" id="togglePwd" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-adm w-100" style="justify-content:center;padding:.75rem;font-size:.97rem;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
      </button>
    </form>

    <p class="mt-4 text-center" style="font-size:.8rem;color:rgba(255,255,255,.2);">
      Protected portal. Unauthorised access prohibited.
    </p>
  </div>
</div>
<script>
  document.getElementById('togglePwd').addEventListener('click', () => {
    const inp = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  });
</script>
</body>
</html>
